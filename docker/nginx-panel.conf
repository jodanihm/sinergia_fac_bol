# docker/nginx-panel.conf -- sinergia_fac_bol (panel)
#
# Reemplaza al servidor embebido "php -S ... panel/router.php" del NAS.
#
# router.php NO se usa aqui, y es correcto que asi sea. Su unico trabajo era:
#   "si la URL apunta a un archivo fisico, servirlo; si no, pasar por index.php"
# (necesario porque php -S resuelve por si mismo cualquier URL que 'parezca
# archivo', ej. terminada en .xml, y devolvia 404 saltandose el router de la
# aplicacion). El try_files de abajo expresa exactamente esa misma regla:
#   $uri existe  -> nginx lo sirve directo   (equivale al "return false")
#   no existe    -> /index.php               (equivale al "require index.php")
# La diferencia esta en el rendimiento, no en el comportamiento: los estaticos
# (css/style.css, img/logo.png) los sirve nginx sin despertar a PHP.

server {
    listen 80 default_server;
    server_name _;

    root  /app/panel/public;
    index index.php;

    # Carga masiva de notas de venta (.xlsx) desde el panel.
    client_max_body_size 32m;

    # Detras de Cloudflare Tunnel: la IP real del visitante viene en el header,
    # no en la conexion (que siempre sera 127.0.0.1 desde cloudflared).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        # Sin esto, una URL /algo.php inexistente se le pasaria igual a PHP.
        try_files $uri =404;

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # La emision contra el SII (getSeed + getToken + envio) puede tardar
        # decenas de segundos. Con el default de 60s el panel cortaria a media
        # emision y dejaria el folio en estado ambiguo.
        fastcgi_read_timeout 300;
    }

    # Nada de archivos ocultos por HTTP: .env, .rcv_internal_key, .git...
    # No deberian estar bajo el docroot, pero es defensa en profundidad.
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Ni respaldos que se hayan colado.
    location ~* \.(bak|backup|old|orig|swp|swo|log|sql)$ {
        deny all;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
