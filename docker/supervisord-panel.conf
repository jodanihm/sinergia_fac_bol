; docker/supervisord-panel.conf -- sinergia_fac_bol (panel)
;
; nginx + php-fpm en un solo contenedor, como quedo decidido (3 contenedores
; en total, no 4). supervisord es PID 1 y mantiene ambos procesos vivos.
;
; Todos los logs van a stdout/stderr para que los recoja el driver json-file
; de Docker (limitado a 10m x 3 en el compose). Sin eso, los logs crecerian
; dentro del contenedor sin techo, en una maquina que comparte disco con
; otros 5 proyectos.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; nginx arranca despues de php-fpm (priority mayor): si aceptara conexiones
; antes de que el socket 9000 exista, el primer request daria 502.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
