; docker/php-produccion.ini -- sinergia_fac_bol
;
; Manejo de errores de PHP en produccion. Lo copian IGUAL docker/Dockerfile.motor
; y docker/Dockerfile.panel a $PHP_INI_DIR/conf.d/zz-produccion.ini.
;
; POR QUE. Las imagenes oficiales de php no traen php.ini: sin este archivo
; valen los defaults de compilacion -- display_errors=On, log_errors=Off,
; expose_php=On. Una excepcion no capturada (MySQL caido, un PDOException fuera
; de try) se le mostraba al usuario con el SQL, las rutas y el stack trace con
; argumentos (DSN, usuario de la base), y no quedaba registrada en ningun lado.
;
; A DONDE VAN LOS ERRORES: a stderr, no a un archivo. Docker ya lo recoge
; (driver json-file con max-size/max-file en docker-compose.vps.yml): en el
; motor directo, y en el panel via php-fpm (catch_workers_output=yes de la
; imagen) -> supervisord (stderr_logfile=/dev/stderr). Un archivo dentro del
; contenedor se perderia en cada recreacion y creceria sin rotar. Se leen con:
;     docker logs sinergia_panel 2>&1 | grep 'PHP '
;     docker logs sinergia_motor 2>&1 | grep 'PHP '

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; El default de php.ini-production: todo menos los avisos de deprecacion, que
; con PHP 8.2 y vendor/ inundarian el log sin decir nada util.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; Sin argumentos en los stack traces: un trace con el DSN o una clave dentro no
; debe llegar ni al log.
zend.exception_ignore_args = On
; Sin cabecera X-Powered-By: PHP/8.2.x.
expose_php = Off
